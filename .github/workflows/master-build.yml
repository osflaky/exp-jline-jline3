name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 25
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-25-arm64
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6.0.1
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
          # No JDK 22 build exists for Windows on ARM64 (it is not an LTS release).
          # Use the x64 Temurin JDK 22 there instead. Windows 11 ARM runs it through
          # its built-in x64 emulation, so this leg still runs the full build on JDK 22.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 22) && 'x64' || '' }}

    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ matrix.java }}-${{ 
          hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ matrix.java }}-
          ${{ runner.os }}-maven-

    - name: Cache mvx tools
      uses: actions/cache@v6
      with:
        path: ~/.mvx/tools
        key: ${{ runner.os }}-mvx-tools-${{ hashFiles('.mvx/config.json5', 
          '.mvx/mvx.properties') }}
        restore-keys: |
          ${{ runner.os }}-mvx-tools-



    - name: Verify macOS native signatures
      if: matrix.os == 'macos-latest'
      run: |
        set -e
        NATIVE_DIR=native/src/main/resources/org/jline/nativ/Mac
        for arch in x86 x86_64 arm64; do
          LIB="$NATIVE_DIR/$arch/libjlinenative.jnilib"
          if [ ! -f "$LIB" ]; then
            echo "::error::$LIB not found"
            exit 1
          fi
          echo "Checking $LIB ..."
          codesign --verify --strict --verbose "$LIB" 2>&1
          INFO=$(codesign --display --verbose=4 "$LIB" 2>&1)
          echo "$INFO"
          if ! echo "$INFO" | grep -q "Authority=Developer ID Application:"; then
            echo "::error::$LIB is not signed with a Developer ID Application certificate"
            exit 1
          fi
          echo "✓ $LIB is signed with Developer ID"
        done
        echo "All macOS native libraries are signed ✓"

    - name: Build with maven
      run: ./mvx mvn --no-transfer-progress verify
      env:
        MVX_USE_SYSTEM_JAVA: true
        MVX_PARALLEL_DOWNLOADS: 1
        MVX_DOWNLOAD_TIMEOUT: 300
        MVX_HTTP_TIMEOUT: 300
      if: matrix.os != 'windows-latest'

    - name: Build with maven
      run: |
        set PATH=%JAVA_HOME%\bin;C:\Windows\System32\WindowsPowerShell\v1.0\
        mvx.cmd mvn --no-transfer-progress verify
      env:
        MVX_USE_SYSTEM_JAVA: true
        MVX_PARALLEL_DOWNLOADS: 1
        MVX_DOWNLOAD_TIMEOUT: 300
        MVX_HTTP_TIMEOUT: 300
      shell: cmd
      if: matrix.os == 'windows-latest'

    name: compile [${{ matrix.expander_leg }}]
    timeout-minutes: 150
